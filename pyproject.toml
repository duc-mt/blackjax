[project]
name = "blackjax"
version = "1.0.0"
description = "A text-based command-line Blackjack game."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mai Tan Duc", email = "ducmai.network@gmail.com" }]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--cov=main --cov=card_deck --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
